services:
  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      # Server-side Supabase calls go straight to Kong over the proxy network
      # instead of out through Traefik. Empty/unset falls back to the public
      # NEXT_PUBLIC_SUPABASE_URL. Runtime var — no rebuild needed to change it.
      - SUPABASE_INTERNAL_URL=${SUPABASE_INTERNAL_URL:-}
      # Instant bug-triage webhook (n8n). Runtime vars — the submit server action
      # POSTs {reportId, secret} here after a report lands. Unset = triage skipped.
      - BUG_TRIAGE_WEBHOOK_URL=${BUG_TRIAGE_WEBHOOK_URL:-}
      - BUG_TRIAGE_WEBHOOK_SECRET=${BUG_TRIAGE_WEBHOOK_SECRET:-}
      # Auto-investigate hook: fired when a report is marked Verify. Shares the
      # triage secret above. Unset = marking Verify just updates status.
      - BUG_INVESTIGATE_WEBHOOK_URL=${BUG_INVESTIGATE_WEBHOOK_URL:-}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flat-rate-tracker.rule=Host(`tracker.slimelab.cc`)"
      - "traefik.http.routers.flat-rate-tracker.entrypoints=websecure-int, websecure-ext"
      - "traefik.http.routers.flat-rate-tracker.tls=true"
      - "traefik.http.routers.flat-rate-tracker.tls.certresolver=cloudflare"
      - "traefik.http.services.flat-rate-tracker.loadbalancer.server.port=3000"

  # ── Visual-regression canary ────────────────────────────────────────────────
  # The image deploy.sh just built, run in fixture mode on a loopback port so the
  # visual gate can photograph it BEFORE any traffic swaps over. Same image as
  # `app` — FRT_FIXTURE_MODE is runtime-only, not a NEXT_PUBLIC_* var, so one
  # build serves both and the gate tests the exact bytes that ship.
  #
  # `profiles` keeps it out of a bare `docker compose up -d` (the deploy step at
  # scripts/deploy.sh). Without it, every deploy would also start a canary and
  # leave it running.
  app-canary:
    profiles: ["canary"]
    image: ${IMAGE_NAME:-}
    restart: "no"
    environment:
      # The only thing that distinguishes this container from production.
      - FRT_FIXTURE_MODE=1
      # SUPABASE_INTERNAL_URL and the webhook vars are deliberately NOT passed.
      # Fixture mode never reaches Postgres, and a canary that could fire the
      # bug-triage webhook would page us over a screenshot.
    ports:
      # Loopback only. This container serves frozen data and stubs auth — it must
      # never be reachable from the network, and it is deliberately off the proxy
      # network with no traefik labels so Traefik cannot route to it.
      #
      # 3901, not the obvious 3001: the photo-booth container already holds 3001
      # on this VM. Anything here must be a port nothing else on the homelab
      # wants, or every deploy fails on a port bind.
      - "127.0.0.1:${CANARY_PORT:-3901}:3000"

networks:
  proxy:
    external: true
